version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"

# Build from the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Install the package with the doc dependency group from pyproject.toml
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
